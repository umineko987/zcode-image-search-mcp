name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check tag matches package version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$(node -p "require('./package.json').version")" ]; then
            echo 'Tag must match package.json version (v<version>)' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Missing repository secret NPM_TOKEN' >&2
            exit 1
          fi
          npm publish --access public
